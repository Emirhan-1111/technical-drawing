name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # runs without the ISO 3098 font, so it also covers the DejaVu Sans fallback
      - run: pytest -q
      - name: render the gallery
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          for e in flanged_bush bearing_bracket stepped_shaft flange spur_gear weldment milled_block from_step; do
            python examples/$e.py out
          done
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: drawings
          path: out/
